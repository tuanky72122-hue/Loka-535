<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LOKA 535</title>
<style>
*{
  box-sizing:border-box;
}
body{
  margin:0;
  min-height:100vh;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:linear-gradient(180deg,#fff4e8,#ffe5d5);
  color:#583f52;
  display:flex;
  justify-content:center;
  align-items:center;
}
.app{
  width:min(94%,520px);
  text-align:center;
  padding:25px 18px 35px;
}
.title{
  font-size:14px;
  font-weight:900;
  letter-spacing:3px;
  color:#a25b72;
}
h1{
  margin:8px 0 5px;
  font-size:30px;
  color:#7d405d;
}
.sub{
  font-size:13px;
  opacity:.7;
  margin-bottom:22px;
}
/* MÈO */
.cat{
  width:145px;
  height:125px;
  margin:0 auto 18px;
  position:relative;
  animation:float 2s ease-in-out infinite;
}
.head{
  position:absolute;
  width:115px;
  height:95px;
  left:15px;
  top:20px;
  background:#fff;
  border-radius:48% 48% 45% 45%;
  border:4px solid #d98c72;
}
.ear{
  position:absolute;
  width:38px;
  height:38px;
  background:#fff;
  border:4px solid #d98c72;
  top:5px;
}
.ear.left{
  left:18px;
  transform:rotate(-25deg);
  border-radius:8px 25px 5px 25px;
}
.ear.right{
  right:18px;
  transform:rotate(25deg);
  border-radius:25px 8px 25px 5px;
}
.eye{
  position:absolute;
  width:11px;
  height:16px;
  background:#4e3847;
  border-radius:50%;
  top:48px;
}
.eye.left{
  left:32px;
}
.eye.right{
  right:32px;
}
.cheek{
  position:absolute;
  width:18px;
  height:10px;
  background:#f4a4a4;
  border-radius:50%;
  top:65px;
}
.cheek.left{
  left:14px;
}
.cheek.right{
  right:14px;
}
.nose{
  position:absolute;
  width:10px;
  height:8px;
  background:#e47e91;
  border-radius:50%;
  left:49px;
  top:64px;
}
.mouth{
  position:absolute;
  width:28px;
  height:17px;
  left:43px;
  top:70px;
  border-bottom:4px solid #5b3b4b;
  border-radius:50%;
}
.paw{
  position:absolute;
  width:42px;
  height:50px;
  background:#fff;
  border:4px solid #d98c72;
  border-radius:50%;
  right:-3px;
  top:30px;
  transform:rotate(-18deg);
  transform-origin:bottom center;
}
.cat.spinning .paw{
  animation:wave .25s infinite alternate;
}
.bell{
  position:absolute;
  width:25px;
  height:20px;
  background:#f4c44e;
  border:3px solid #d39b28;
  border-radius:50%;
  left:45px;
  bottom:0;
}
@keyframes float{
  50%{transform:translateY(-5px)}
}
@keyframes wave{
  from{transform:rotate(-25deg)}
  to{transform:rotate(20deg)}
}
/* SỐ */
.numbers{
  display:flex;
  justify-content:center;
  gap:9px;
  flex-wrap:wrap;
  min-height:65px;
}
.ball{
  width:58px;
  height:58px;
  border-radius:50%;
  display:grid;
  place-items:center;
  background:#f29bad;
  color:white;
  font-size:21px;
  font-weight:900;
  box-shadow:0 5px 12px #9b5b6b44;
}
.ball.show{
  animation:pop .25s ease-out;
}
@keyframes pop{
  0%{transform:scale(.5)}
  80%{transform:scale(1.12)}
  100%{transform:scale(1)}
}
.special-box{
  margin-top:20px;
}
.special-label{
  font-size:11px;
  font-weight:900;
  letter-spacing:2px;
  margin-bottom:8px;
  opacity:.7;
}
.special{
  width:78px;
  height:78px;
  margin:auto;
  border-radius:50%;
  display:grid;
  place-items:center;
  background:#f4bd55;
  color:white;
  font-size:28px;
  font-weight:900;
  box-shadow:0 7px 16px #a8783544;
}
.status{
  min-height:25px;
  margin:20px 0 13px;
  font-size:13px;
  font-weight:800;
}
button{
  border:0;
  background:#7d405d;
  color:white;
  border-radius:999px;
  padding:15px 42px;
  font-size:17px;
  font-weight:900;
  box-shadow:0 6px 0 #562d40;
  cursor:pointer;
}
button:active{
  transform:translateY(4px);
  box-shadow:0 2px 0 #562d40;
}
.info{
  margin-top:18px;
  font-size:11px;
  line-height:1.6;
  opacity:.65;
}
.error{
  color:#b52e2e;
  font-weight:800;
}
</style>
</head>
<body>
<div class="app">
  <div class="title">✦ LOKA 535 ✦</div>
  <h1>Mèo thần tài</h1>
  <div class="sub">
    Lotto 5/35 · Một bộ số tham khảo
  </div>
  <!-- MÈO -->
  <div class="cat" id="cat">
    <div class="ear left"></div>
    <div class="ear right"></div>
    <div class="head">
      <div class="eye left"></div>
      <div class="eye right"></div>
      <div class="cheek left"></div>
      <div class="cheek right"></div>
      <div class="nose"></div>
      <div class="mouth"></div>
    </div>
    <div class="paw"></div>
    <div class="bell"></div>
  </div>
  <!-- 5 SỐ -->
  <div class="numbers" id="numbers">
    <div class="ball">?</div>
    <div class="ball">?</div>
    <div class="ball">?</div>
    <div class="ball">?</div>
    <div class="ball">?</div>
  </div>
  <!-- SỐ ĐẶC BIỆT -->
  <div class="special-box">
    <div class="special-label">
      SỐ ĐẶC BIỆT
    </div>
    <div class="special" id="special">
      ?
    </div>
  </div>
  <div class="status" id="status">
    Mèo thần tài đang chờ Loka ✨
  </div>
  <button id="btn">
    QUAY SỐ
  </button>
  <div class="info">
    Dữ liệu lịch sử được đọc từ history.json.<br>
    Bộ số được chọn bằng weighted random từ tần suất 50 và 100 kỳ gần nhất.
  </div>
</div>
<script>
const balls = document.querySelectorAll(".ball");
const special = document.getElementById("special");
const button = document.getElementById("btn");
const status = document.getElementById("status");
const cat = document.getElementById("cat");
let history = [];
/* =========================
   ĐỌC DỮ LIỆU
========================= */
async function loadHistory(){
  const response = await fetch(
    "history.json?cache=" + Date.now()
  );
  if(!response.ok){
    throw new Error("Không đọc được history.json");
  }
  const data = await response.json();
  if(!Array.isArray(data) || data.length === 0){
    throw new Error("history.json không có dữ liệu");
  }
  return data;
}
/* =========================
   RANDOM AN TOÀN
========================= */
function random(){
  const array = new Uint32Array(1);
  crypto.getRandomValues(array);
  return array[0] / 4294967296;
}
/* =========================
   TÍNH TẦN SUẤT
========================= */
function frequency(records, max, specialMode){
  const freq = Array(max + 1).fill(0);
  for(const draw of records){
    const values = specialMode
      ? [Number(draw.special)]
      : draw.numbers.map(Number);
    for(const n of values){
      if(n >= 1 && n <= max){
        freq[n]++;
      }
    }
  }
  return freq;
}
/* =========================
   TẠO TRỌNG SỐ
========================= */
function makeWeights(records, max, specialMode){
  const freq = frequency(
    records,
    max,
    specialMode
  );
  const expected = specialMode
    ? records.length / max
    : records.length * 5 / max;
  const weights = [];
  for(let n = 1; n <= max; n++){
    const weight =
      Math.max(
        freq[n] / expected,
        0.01
      );
    weights.push(weight);
  }
  return weights;
}
/* =========================
   LẤY 1 SỐ THEO TRỌNG SỐ
========================= */
function weightedPick(items, weights){
  let total = 0;
  for(const w of weights){
    total += w;
  }
  let r = random() * total;
  for(let i = 0; i < items.length; i++){
    r -= weights[i];
    if(r <= 0){
      return items[i];
    }
  }
  return items[items.length - 1];
}
/* =========================
   CHỌN 5 SỐ
========================= */
function generateMain(){
  const recent50 =
    history.slice(-50);
  const recent100 =
    history.slice(-100);
  const w50 =
    makeWeights(
      recent50,
      35,
      false
    );
  const w100 =
    makeWeights(
      recent100,
      35,
      false
    );
  const numbers = [];
  const available = [];
  const weights = [];
  for(let n = 1; n <= 35; n++){
    available.push(n);
    weights.push(
      w50[n - 1] * 0.5 +
      w100[n - 1] * 0.5
    );
  }
  while(numbers.length < 5){
    const selected =
      weightedPick(
        available,
        weights
      );
    numbers.push(selected);
    const index =
      available.indexOf(selected);
    available.splice(index,1);
    weights.splice(index,1);
  }
  return numbers.sort(
    (a,b) => a-b
  );
}
/* =========================
   CHỌN SỐ ĐẶC BIỆT
========================= */
function generateSpecial(){
  const recent50 =
    history.slice(-50);
  const recent100 =
    history.slice(-100);
  const w50 =
    makeWeights(
      recent50,
      12,
      true
    );
  const w100 =
    makeWeights(
      recent100,
      12,
      true
    );
  const items = [];
  const weights = [];
  for(let n = 1; n <= 12; n++){
    items.push(n);
    weights.push(
      w50[n - 1] * 0.5 +
      w100[n - 1] * 0.5
    );
  }
  return weightedPick(
    items,
    weights
  );
}
/* =========================
   HIỆN SỐ
========================= */
function showBall(element, number){
  element.textContent =
    String(number).padStart(2,"0");
  element.classList.remove("show");
  void element.offsetWidth;
  element.classList.add("show");
}
/* =========================
   QUAY
========================= */
async function generate(){
  button.disabled = true;
  cat.classList.add("spinning");
  special.textContent = "?";
  balls.forEach(
    ball => {
      ball.textContent = "?";
      ball.classList.remove("show");
    }
  );
  status.textContent =
    "🐱 Mèo thần tài đang suy nghĩ...";
  await wait(500);
  const numbers =
    generateMain();
  const specialNumber =
    generateSpecial();
  status.textContent =
    "✨ Mèo đang nhả số...";
  for(let i = 0; i < numbers.length; i++){
    showBall(
      balls[i],
      numbers[i]
    );
    await wait(350);
  }
  await wait(300);
  showBall(
    special,
    specialNumber
  );
  status.textContent =
    "🎉 Đã chọn xong một bộ số!";
  cat.classList.remove("spinning");
  button.disabled = false;
}
/* =========================
   DELAY
========================= */
function wait(ms){
  return new Promise(
    resolve => setTimeout(resolve,ms)
  );
}
/* =========================
   START
========================= */
async function start(){
  try{
    history =
      await loadHistory();
    status.textContent =
      "Đã tải " +
      history.length +
      " kỳ. Sẵn sàng!";
  }catch(error){
    console.error(error);
    status.innerHTML =
      '<span class="error">' +
      "Lỗi: không đọc được dữ liệu." +
      "</span>";
    button.disabled = true;
  }
}
/* =========================
   BUTTON
========================= */
button.addEventListener(
  "click",
  generate
);
/* CHẠY */
start();
</script>
</body>
</html>
