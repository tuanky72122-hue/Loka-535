<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>LOKA-535</title>
<style>
* {
  box-sizing: border-box;
}
body {
  margin: 0;
  min-height: 100vh;
  overflow-x: hidden;
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display",
    "Segoe UI", sans-serif;
  color: #fff;
  background:
    radial-gradient(circle at 50% 18%, #49302c 0%, #20151a 35%, #08090e 78%);
}
.container {
  width: min(680px, 94%);
  margin: auto;
  padding: 24px 0 55px;
}
.header {
  text-align: center;
}
.logo {
  color: #e7c98b;
  font-size: 11px;
  font-weight: 900;
  letter-spacing: 5px;
}
.title {
  margin-top: 7px;
  font-size: 32px;
  font-weight: 950;
  letter-spacing: -1px;
}
.subtitle {
  margin-top: 5px;
  color: #aa9c9c;
  font-size: 12px;
}
/* =====================================================
   JAPANESE CHIBI MANEKI NEKO
   ===================================================== */
.cat-stage {
  position: relative;
  height: 330px;
  display: flex;
  justify-content: center;
  align-items: center;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}
.cat-stage::before {
  content: "";
  position: absolute;
  width: 230px;
  height: 230px;
  border-radius: 50%;
  background: radial-gradient(
    circle,
    rgba(255,204,94,.17),
    transparent 68%
  );
  filter: blur(10px);
}
.cat {
  position: relative;
  width: 210px;
  height: 260px;
  transform-origin: 50% 88%;
  z-index: 5;
  animation: idleFloat 3s ease-in-out infinite;
}
/* EARS */
.ear {
  position: absolute;
  top: 19px;
  width: 62px;
  height: 67px;
  background: linear-gradient(145deg,#fffaf0,#e9e1d5);
  border: 4px solid #33272a;
  z-index: 1;
}
.ear.left {
  left: 29px;
  border-radius: 15px 48px 10px 45px;
  transform: rotate(-20deg);
}
.ear.right {
  right: 29px;
  border-radius: 48px 15px 45px 10px;
  transform: rotate(20deg);
}
.ear::after {
  content: "";
  position: absolute;
  width: 31px;
  height: 36px;
  top: 13px;
  left: 13px;
  background: #efb1aa;
  border-radius: 50%;
}
/* HEAD */
.head {
  position: absolute;
  top: 43px;
  left: 20px;
  width: 170px;
  height: 142px;
  border-radius: 48% 48% 44% 44%;
  background:
    radial-gradient(circle at 35% 27%, #fffdf8 0 12%, transparent 13%),
    linear-gradient(145deg,#fffdf8,#e9e1d7);
  border: 4px solid #33272a;
  z-index: 3;
  box-shadow:
    0 12px 25px rgba(0,0,0,.35),
    inset -7px -8px 0 rgba(130,105,90,.08);
}
/* RED HEAD PATCH */
.patch {
  position: absolute;
  top: 0;
  right: 20px;
  width: 65px;
  height: 55px;
  border-radius: 0 40px 50px 30px;
  background: #c84c48;
  opacity: .95;
}
/* EYES */
.eye {
  position: absolute;
  top: 57px;
  width: 23px;
  height: 29px;
  border-radius: 50%;
  background: #21171a;
}
.eye.left {
  left: 42px;
}
.eye.right {
  right: 42px;
}
.eye::before {
  content: "";
  position: absolute;
  width: 7px;
  height: 9px;
  border-radius: 50%;
  background: white;
  left: 5px;
  top: 4px;
}
/* CHEEKS */
.cheek {
  position: absolute;
  top: 91px;
  width: 25px;
  height: 13px;
  border-radius: 50%;
  background: rgba(236,117,106,.45);
}
.cheek.left {
  left: 17px;
}
.cheek.right {
  right: 17px;
}
/* NOSE + MOUTH */
.nose {
  position: absolute;
  top: 83px;
  left: 74px;
  width: 21px;
  height: 15px;
  background: #d87972;
  border-radius: 50%;
}
.mouth {
  position: absolute;
  left: 67px;
  top: 96px;
  width: 37px;
  height: 28px;
  border-bottom: 5px solid #342124;
  border-radius: 0 0 50% 50%;
}
.mouth::before,
.mouth::after {
  content: "";
  position: absolute;
  top: -2px;
  width: 16px;
  height: 10px;
  border-bottom: 3px solid #342124;
}
.mouth::before {
  left: -3px;
  transform: rotate(20deg);
}
.mouth::after {
  right: -3px;
  transform: rotate(-20deg);
}
/* WHISKERS */
.whisker {
  position: absolute;
  width: 43px;
  height: 2px;
  background: #796a68;
  top: 94px;
}
.w1 {
  left: -27px;
  transform: rotate(-8deg);
}
.w2 {
  left: -27px;
  top: 106px;
  transform: rotate(8deg);
}
.w3 {
  right: -27px;
  transform: rotate(8deg);
}
.w4 {
  right: -27px;
  top: 106px;
  transform: rotate(-8deg);
}
/* BODY */
.body {
  position: absolute;
  left: 38px;
  bottom: 14px;
  width: 135px;
  height: 115px;
  border-radius: 60px 60px 42px 42px;
  background: linear-gradient(145deg,#fffdf8,#ddd4c9);
  border: 4px solid #33272a;
  z-index: 2;
}
/* BELLY */
.belly {
  position: absolute;
  left: 28px;
  top: 23px;
  width: 74px;
  height: 77px;
  border-radius: 50%;
  background: #fffaf0;
  border: 2px solid rgba(90,70,65,.12);
}
/* RED COLLAR */
.collar {
  position: absolute;
  left: 25px;
  top: 0;
  width: 84px;
  height: 27px;
  background: #bf393b;
  border-radius: 0 0 20px 20px;
  z-index: 5;
}
.collar::after {
  content: "鈴";
  position: absolute;
  left: 31px;
  top: 3px;
  color: #ffd86a;
  font-size: 15px;
  font-weight: 900;
}
/* LEFT PAW */
.paw-left {
  position: absolute;
  left: 3px;
  top: 101px;
  width: 57px;
  height: 72px;
  background: linear-gradient(145deg,#fffdf8,#e1d8cd);
  border: 4px solid #33272a;
  border-radius: 50%;
  transform: rotate(-22deg);
  z-index: 7;
}
/* RIGHT WAVING PAW */
.paw-right {
  position: absolute;
  right: -3px;
  top: 75px;
  width: 59px;
  height: 82px;
  background: linear-gradient(145deg,#fffdf8,#e1d8cd);
  border: 4px solid #33272a;
  border-radius: 50%;
  transform-origin: 50% 90%;
  z-index: 7;
  animation: luckyWave 1.35s ease-in-out infinite;
}
.paw-line {
  position: absolute;
  width: 4px;
  height: 18px;
  border-radius: 5px;
  background: #8b7771;
  bottom: 11px;
}
.paw-line.one {
  left: 14px;
  transform: rotate(-8deg);
}
.paw-line.two {
  left: 26px;
}
.paw-line.three {
  left: 38px;
  transform: rotate(8deg);
}
/* COIN */
.coin {
  position: absolute;
  right: -13px;
  bottom: 29px;
  width: 65px;
  height: 65px;
  border-radius: 50%;
  background:
    radial-gradient(circle,#ffe58b 0 55%,#c98d20 56% 100%);
  border: 4px solid #8d6418;
  z-index: 8;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #996b18;
  font-size: 27px;
  font-weight: 900;
  box-shadow: 0 8px 18px rgba(0,0,0,.3);
  transform: rotate(-12deg);
}
/* KANJI */
.coin::after {
  content: "招福";
  font-size: 12px;
  position: absolute;
  color: #8f651a;
}
/* LITTLE RED BIB */
.bib {
  position: absolute;
  left: 50%;
  bottom: 8px;
  transform: translateX(-50%);
  width: 70px;
  height: 40px;
  background: #c43d3e;
  clip-path: polygon(0 0,100% 0,78% 100%,22% 100%);
  z-index: 6;
}
.bib::after {
  content: "福";
  position: absolute;
  inset: 4px;
  display: flex;
  justify-content: center;
  align-items: center;
  color: #ffd66b;
  font-size: 23px;
  font-weight: 900;
}
/* LUCKY BALLS */
.output {
  position: absolute;
  z-index: 12;
  left: 50%;
  top: 141px;
  width: 20px;
  height: 20px;
  transform: translate(-50%,-50%);
  pointer-events: none;
}
.fly-ball {
  position: absolute;
  left: 0;
  top: 0;
  width: 42px;
  height: 42px;
  margin-left: -21px;
  margin-top: -21px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  background: linear-gradient(145deg,#fff,#c8d3df);
  color: #0b111a;
  font-size: 13px;
  font-weight: 900;
  border: 2px solid rgba(0,0,0,.18);
  box-shadow: 0 8px 20px rgba(0,0,0,.4);
  animation: spitBall 1.15s cubic-bezier(.18,.9,.25,1) forwards;
}
@keyframes spitBall {
  0% {
    opacity: 0;
    transform:
      translate(0,0)
      scale(.15)
      rotate(0deg);
  }
  18% {
    opacity: 1;
    transform:
      translate(0,-5px)
      scale(1.05)
      rotate(25deg);
  }
  100% {
    opacity: 1;
    transform:
      translate(var(--x),var(--y))
      scale(1)
      rotate(360deg);
  }
}
/* SPARKLES */
.spark {
  position: absolute;
  color: #ffd96b;
  font-size: 19px;
  z-index: 2;
  animation: sparkle 1.8s ease-in-out infinite;
}
.s1 {
  left: 17%;
  top: 28%;
}
.s2 {
  right: 18%;
  top: 20%;
  animation-delay: .4s;
}
.s3 {
  left: 23%;
  bottom: 16%;
  animation-delay: .8s;
}
.s4 {
  right: 23%;
  bottom: 12%;
  animation-delay: 1.2s;
}
/* CAT IDLE */
@keyframes idleFloat {
  0%,100% {
    transform: translateY(0);
  }
  50% {
    transform: translateY(-6px);
  }
}
@keyframes luckyWave {
  0%,100% {
    transform: rotate(12deg);
  }
  50% {
    transform: rotate(35deg);
  }
}
@keyframes sparkle {
  0%,100% {
    opacity: .25;
    transform: scale(.7);
  }
  50% {
    opacity: 1;
    transform: scale(1.25);
  }
}
/* =====================================================
   CLICK / SPIN
   ===================================================== */
.spinning .cat {
  animation:
    catSpin 1.25s cubic-bezier(.45,0,.55,1) infinite;
}
.spinning .paw-right {
  animation:
    pawCrazy .28s ease-in-out infinite;
}
.spinning .coin {
  animation:
    coinSpin .35s linear infinite;
}
.spinning .cat-stage {
  cursor: wait;
}
@keyframes catSpin {
  0% {
    transform: rotate(0deg) scale(1);
  }
  25% {
    transform: rotate(-5deg) scale(1.04);
  }
  50% {
    transform: rotate(5deg) scale(1.04);
  }
  75% {
    transform: rotate(-4deg) scale(1.03);
  }
  100% {
    transform: rotate(0deg) scale(1);
  }
}
@keyframes pawCrazy {
  0% {
    transform: rotate(5deg);
  }
  50% {
    transform: rotate(48deg);
  }
  100% {
    transform: rotate(5deg);
  }
}
@keyframes coinSpin {
  from {
    transform: rotate(0deg);
  }
  to {
    transform: rotate(360deg);
  }
}
/* =====================================================
   BUTTON
   ===================================================== */
.button {
  width: 100%;
  border: 0;
  border-radius: 18px;
  padding: 18px;
  background: linear-gradient(135deg,#fff,#d4dce5);
  color: #10141b;
  font-size: 16px;
  font-weight: 950;
  letter-spacing: 1px;
  box-shadow: 0 12px 35px rgba(0,0,0,.35);
  cursor: pointer;
  transition: .2s;
}
.button:active {
  transform: scale(.97);
}
.button:disabled {
  opacity: .6;
}
/* =====================================================
   STATUS
   ===================================================== */
.status {
  height: 30px;
  margin-top: 13px;
  text-align: center;
  color: #b3a7a4;
  font-size: 13px;
}
/* =====================================================
   RESULT
   ===================================================== */
.result {
  margin-top: 14px;
  padding: 23px;
  border-radius: 25px;
  background: rgba(16,20,29,.9);
  border: 1px solid rgba(255,255,255,.08);
  box-shadow: 0 20px 55px rgba(0,0,0,.35);
  animation: resultIn .7s ease;
}
@keyframes resultIn {
  from {
    opacity: 0;
    transform: translateY(20px) scale(.94);
  }
  to {
    opacity: 1;
    transform: translateY(0) scale(1);
  }
}
.result-title {
  text-align: center;
  color: #b2a9aa;
  font-size: 11px;
  letter-spacing: 3px;
  font-weight: 900;
  margin-bottom: 18px;
}
.numbers {
  display: flex;
  justify-content: center;
  gap: 9px;
  flex-wrap: wrap;
}
.ball {
  width: 51px;
  height: 51px;
  border-radius: 50%;
  display: flex;
  justify-content: center;
  align-items: center;
  background: linear-gradient(145deg,#fff,#c3cfdb);
  color: #0b1119;
  font-size: 17px;
  font-weight: 950;
  box-shadow: 0 8px 22px rgba(0,0,0,.4);
  animation: ballReveal .55s cubic-bezier(.2,1.5,.4,1) both;
}
@keyframes ballReveal {
  from {
    opacity: 0;
    transform: scale(.15) rotate(-180deg);
  }
  to {
    opacity: 1;
    transform: scale(1) rotate(0);
  }
}
.special-box {
  margin-top: 23px;
  text-align: center;
}
.special-label {
  margin-bottom: 8px;
  color: #b2a9aa;
  font-size: 10px;
  letter-spacing: 2px;
}
.special {
  width: 57px;
  height: 57px;
  margin: auto;
  display: flex;
  justify-content: center;
  align-items: center;
  border-radius: 50%;
  background: linear-gradient(145deg,#f4d77f,#a9781f);
  color: #fff;
  font-size: 18px;
  font-weight: 950;
  box-shadow: 0 8px 25px rgba(210,160,45,.3);
  animation: specialReveal .8s cubic-bezier(.2,1.5,.4,1) both;
}
@keyframes specialReveal {
  from {
    opacity: 0;
    transform: scale(.1) rotate(360deg);
  }
  to {
    opacity: 1;
    transform: scale(1) rotate(0);
  }
}
/* =====================================================
   ANALYSIS
   ===================================================== */
.analysis {
  margin-top: 19px;
}
.analysis-title {
  color: #9e9697;
  font-size: 11px;
  letter-spacing: 2px;
  font-weight: 900;
  margin-bottom: 9px;
}
.reason {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 11px 0;
  border-bottom: 1px solid rgba(255,255,255,.055);
}
.reason:last-child {
  border-bottom: 0;
}
.reason-ball {
  width: 36px;
  height: 36px;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 50%;
  background: rgba(255,255,255,.08);
  font-size: 12px;
  font-weight: 900;
}
.reason-text {
  color: #c4cbd5;
  font-size: 13px;
  line-height: 1.45;
}
.reason-text strong {
  color: #fff;
}
.special-reason {
  color: #d8be72;
}
/* INFO */
.info {
  margin-top: 16px;
  padding: 15px;
  border-radius: 17px;
  background: rgba(255,255,255,.035);
  color: #817e83;
  font-size: 11px;
  line-height: 1.6;
  text-align: center;
}
/* MOBILE */
@media (max-width:450px) {
  .container {
    width: 94%;
  }
  .title {
    font-size: 29px;
  }
  .cat-stage {
    height: 305px;
  }
  .cat {
    transform: scale(.9);
  }
  .ball {
    width: 47px;
    height: 47px;
    font-size: 16px;
  }
}
.hidden {
  display: none;
}
</style>

<script>
/* =====================================================
   SETTINGS
   ===================================================== */
const SHORT_WINDOW = 50;
const LONG_WINDOW = 100;
let history = [];
let busy = false;
/* =====================================================
   LOAD DATA
   ===================================================== */
async function loadHistory() {
  const response =
    await fetch(
      "history.json?ts=" + Date.now()
    );
  if (!response.ok) {
    throw new Error(
      "Không tải được history.json"
    );
  }
  history = await response.json();
  history.sort(
    (a,b) => a.id - b.id
  );
  document.getElementById(
    "status"
  ).textContent =
    "Đã sẵn sàng • " +
    history.length +
    " kỳ dữ liệu";
}
/* =====================================================
   FREQUENCY
   ===================================================== */
function frequency(
  records,
  max,
  special = false
) {
  const result = {};
  for (
    let i = 1;
    i <= max;
    i++
  ) {
    result[i] = 0;
  }
  for (
    const record of records
  ) {
    if (special) {
      if (
        result[record.special] !== undefined
      ) {
        result[record.special]++;
      }
    } else {
      for (
        const number of record.numbers
      ) {
        if (
          result[number] !== undefined
        ) {
          result[number]++;
        }
      }
    }
  }
  return result;
}
/* =====================================================
   WEIGHTS
   ===================================================== */
function weights(
  freq,
  window,
  max,
  perDraw
) {
  const expected =
    window * perDraw / max;
  const result = {};
  for (
    let i = 1;
    i <= max;
    i++
  ) {
    result[i] =
      Math.max(
        freq[i] / expected,
        .01
      );
  }
  return result;
}
function blend(
  shortWeights,
  longWeights,
  max
) {
  const result = {};
  for (
    let i = 1;
    i <= max;
    i++
  ) {
    result[i] =
      shortWeights[i] * .5 +
      longWeights[i] * .5;
  }
  return result;
}
/* =====================================================
   RANDOM
   ===================================================== */
function randomNumber() {
  const array =
    new Uint32Array(1);
  crypto.getRandomValues(array);
  return (
    array[0] / 4294967296
  );
}
function weightedPick(
  weight,
  count
) {
  const available = {
    ...weight
  };
  const selected = [];
  while (
    selected.length < count
  ) {
    let total = 0;
    for (
      const number in available
    ) {
      total += available[number];
    }
    const target =
      randomNumber() * total;
    let current = 0;
    for (
      const number in available
    ) {
      current +=
        available[number];
      if (
        target <= current
      ) {
        selected.push(
          Number(number)
        );
        delete available[number];
        break;
      }
    }
  }
  return selected.sort(
    (a,b) => a-b
  );
}
/* =====================================================
   SIMPLE REASON
   ===================================================== */
function reasonFor(
  number,
  shortFreq,
  longFreq
) {
  const short =
    shortFreq[number];
  const long =
    longFreq[number];
  const shortAverage =
    50 * 5 / 35;
  const longAverage =
    100 * 5 / 35;
  const shortRatio =
    short / shortAverage;
  const longRatio =
    long / longAverage;
  if (
    shortRatio > 1.15 &&
    shortRatio > longRatio
  ) {
    return "xuất hiện khá nổi bật trong các kỳ gần đây";
  }
  if (
    shortRatio > 1.05
  ) {
    return "có tần suất tốt trong dữ liệu gần đây";
  }
  if (
    longRatio > 1.05
  ) {
    return "có mức xuất hiện đáng chú ý trong dữ liệu dài hơn";
  }
  return "được dữ liệu lịch sử đưa vào quá trình lựa chọn";
}
/* =====================================================
   SHOOT BALLS FROM CAT
   ===================================================== */
function shootBall(
  number,
  index,
  total
) {
  const output =
    document.getElementById(
      "output"
    );
  const ball =
    document.createElement("div");
  ball.className =
    "fly-ball";
  ball.textContent =
    String(number).padStart(2,"0");
  const spread =
    (index - (total - 1) / 2) * 54;
  const vertical =
    -150 -
    Math.abs(
      index - (total - 1) / 2
    ) * 10;
  ball.style.setProperty(
    "--x",
    spread + "px"
  );
  ball.style.setProperty(
    "--y",
    vertical + "px"
  );
  output.appendChild(ball);
  setTimeout(
    () => ball.remove(),
    1300
  );
}
/* =====================================================
   GENERATE
   ===================================================== */
async function generate() {
  if (busy) {
    return;
  }
  if (
    history.length < LONG_WINDOW
  ) {
    alert(
      "Chưa đủ dữ liệu để phân tích."
    );
    return;
  }
  busy = true;
  const app =
    document.getElementById(
      "app"
    );
  const stage =
    document.getElementById(
      "catStage"
    );
  const button =
    document.getElementById(
      "generateButton"
    );
  const status =
    document.getElementById(
      "status"
    );
  const result =
    document.getElementById(
      "result"
    );
  button.disabled = true;
  result.classList.add(
    "hidden"
  );
  app.classList.add(
    "spinning"
  );
  /* ==============================================
     SUSPENSE
     ============================================== */
  status.textContent =
    "🐱 Mèo thần tài đang suy nghĩ...";
  await wait(700);
  status.textContent =
    "🔔 Ting ting...";
  await wait(550);
  status.textContent =
    "✨ Đang gom những con số nổi bật...";
  await wait(700);
  /* ==============================================
     CALCULATE
     ============================================== */
  const shortHistory =
    history.slice(
      -SHORT_WINDOW
    );
  const longHistory =
    history.slice(
      -LONG_WINDOW
    );
  const shortFreq =
    frequency(
      shortHistory,
      35
    );
  const longFreq =
    frequency(
      longHistory,
      35
    );
  const shortWeights =
    weights(
      shortFreq,
      SHORT_WINDOW,
      35,
      5
    );
  const longWeights =
    weights(
      longFreq,
      LONG_WINDOW,
      35,
      5
    );
  const finalWeights =
    blend(
      shortWeights,
      longWeights,
      35
    );
  const numbers =
    weightedPick(
      finalWeights,
      5
    );
  /* SPECIAL */
  const shortSpecialFreq =
    frequency(
      shortHistory,
      12,
      true
    );
  const longSpecialFreq =
    frequency(
      longHistory,
      12,
      true
    );
  const shortSpecialWeights =
    weights(
      shortSpecialFreq,
      SHORT_WINDOW,
      12,
      1
    );
  const longSpecialWeights =
    weights(
      longSpecialFreq,
      LONG_WINDOW,
      12,
      1
    );
  const finalSpecialWeights =
    blend(
      shortSpecialWeights,
      longSpecialWeights,
      12
    );
  const special =
    weightedPick(
      finalSpecialWeights,
      1
    )[0];
  /* ==============================================
     SPIT NUMBERS
     ============================================== */
  await wait(400);
  numbers.forEach(
    (number,index) => {
      setTimeout(
        () => {
          shootBall(
            number,
            index,
            numbers.length
          );
        },
        index * 230
      );
    }
  );
  await wait(1450);
  /* ==============================================
     SHOW RESULT
     ============================================== */
  document.getElementById(
    "numbers"
  ).innerHTML =
    numbers.map(
      (number,index) => {
        return `
          <div
            class="ball"
            style="
              animation-delay:
              ${index * .12}s
            "
          >
            ${String(number).padStart(2,"0")}
          </div>
        `;
      }
    ).join("");
  document.getElementById(
    "special"
  ).textContent =
    String(special).padStart(
      2,
      "0"
    );
  /* ==============================================
     REASONS
     ============================================== */
  document.getElementById(
    "reasons"
  ).innerHTML =
    numbers.map(
      number => {
        return `
          <div class="reason">
            <div class="reason-ball">
              ${String(number).padStart(2,"0")}
            </div>
            <div class="reason-text">
              <strong>
                ${String(number).padStart(2,"0")}
              </strong>
              được chọn vì
              ${reasonFor(
                number,
                shortFreq,
                longFreq
              )}.
            </div>
          </div>
        `;
      }
    ).join("");
  /* SPECIAL REASON */
  const specialShort =
    shortSpecialFreq[special];
  const specialLong =
    longSpecialFreq[special];
  let specialReason =
    "được dữ liệu lịch sử đưa vào quá trình lựa chọn";
  if (
    specialShort >
    specialLong / 2
  ) {
    specialReason =
      "có tần suất xuất hiện khá đáng chú ý gần đây";
  }
  document.getElementById(
    "reasons"
  ).innerHTML += `
    <div class="reason">
      <div class="reason-ball">
        ${String(special).padStart(2,"0")}
      </div>
      <div class="reason-text special-reason">
        <strong>
          Đặc biệt ${String(special).padStart(2,"0")}
        </strong>
        được chọn vì
        ${specialReason}.
      </div>
    </div>
  `;
  document.getElementById(
    "dataCount"
  ).textContent =
    history.length;
  result.classList.remove(
    "hidden"
  );
  app.classList.remove(
    "spinning"
  );
  status.textContent =
    "🎉 Mèo đã nhả đủ số!";
  button.disabled = false;
  busy = false;
  result.scrollIntoView({
    behavior: "smooth",
    block: "start"
  });
}
/* =====================================================
   WAIT
   ===================================================== */
function wait(ms) {
  return new Promise(
    resolve =>
      setTimeout(resolve,ms)
  );
}
/* =====================================================
   START
   ===================================================== */
loadHistory().catch(
  error => {
    console.error(error);
    document.getElementById(
      "status"
    ).textContent =
      "Không thể tải dữ liệu lịch sử.";
  }
);
</script>
