<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LOKA 5/35</title>
<style>
/* =========================
   GLOBAL
========================= */
* {
    box-sizing: border-box;
}
body {
    margin: 0;
    min-height: 100vh;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    background:
        radial-gradient(
            circle at top,
            #ffffff 0%,
            #f4f7e9 45%,
            #e9f0df 100%
        );
    color: #35513d;
    display: flex;
    justify-content: center;
    align-items: center;
}
.container {
    width: 100%;
    max-width: 430px;
    padding: 24px 18px 35px;
    text-align: center;
}
/* =========================
   TITLE
========================= */
h1 {
    margin: 0;
    font-size: 29px;
    font-weight: 800;
    color: #3f7d58;
    letter-spacing: 1px;
}
.subtitle {
    margin-top: 5px;
    font-size: 14px;
    color: #7b927d;
}
/* =========================
   CAT AREA
========================= */
.cat-area {
    position: relative;
    width: 220px;
    height: 230px;
    margin: 20px auto 5px;
}
/* =========================
   CAT
========================= */
.cat {
    position: absolute;
    width: 150px;
    height: 128px;
    left: 28px;
    top: 48px;
    background: #d9b66f;
    border: 3px solid #8a6a3d;
    border-radius:
        48%
        48%
        42%
        42%;
    z-index: 2;
    transition:
        transform 0.2s ease;
}
/* ears */
.cat::before,
.cat::after {
    content: "";
    position: absolute;
    top: -28px;
    width: 43px;
    height: 43px;
    background: #d9b66f;
    border: 3px solid #8a6a3d;
    transform: rotate(45deg);
    z-index: -1;
}
.cat::before {
    left: 8px;
}
.cat::after {
    right: 8px;
}
/* inner ears */
.cat-ear {
    position: absolute;
    width: 18px;
    height: 18px;
    background: #9dbb7d;
    transform: rotate(45deg);
    top: -14px;
    border-radius: 4px;
}
.cat-ear.left {
    left: 20px;
}
.cat-ear.right {
    right: 20px;
}
/* eyes */
.eye {
    position: absolute;
    width: 11px;
    height: 15px;
    background: #35513d;
    border-radius: 50%;
    top: 38px;
}
.eye.left {
    left: 42px;
}
.eye.right {
    right: 42px;
}
/* cheeks */
.cheek {
    position: absolute;
    width: 25px;
    height: 12px;
    background: #d99178;
    border-radius: 50%;
    top: 64px;
}
.cheek.left {
    left: 11px;
}
.cheek.right {
    right: 11px;
}
/* nose */
.nose {
    position: absolute;
    width: 12px;
    height: 9px;
    background: #bd725f;
    border-radius: 50%;
    top: 61px;
    left: 50%;
    transform:
        translateX(-50%);
}
/* =========================
   MOUTH
========================= */
.mouth {
    position: absolute;
    width: 30px;
    height: 17px;
    left: 50%;
    top: 69px;
    transform:
        translateX(-50%);
    border-bottom:
        3px solid #5d513d;
    border-radius: 50%;
    transition:
        height 0.15s ease,
        border-radius 0.15s ease;
}
/*
   Khi mèo nhả số,
   miệng mở rộng nhẹ.
*/
.cat.spitting .mouth {
    height: 24px;
    border-radius:
        0 0 50% 50%;
}
/* =========================
   PAW
========================= */
.paw {
    position: absolute;
    width: 43px;
    height: 70px;
    right: -23px;
    top: 3px;
    background: #d9b66f;
    border:
        3px solid #8a6a3d;
    border-radius: 50%;
    transform:
        rotate(-25deg);
}
/* =========================
   GOLD COIN
========================= */
.coin {
    position: absolute;
    width: 47px;
    height: 47px;
    right: -10px;
    bottom: -14px;
    border-radius: 50%;
    background:
        radial-gradient(
            circle,
            #fff0a8 0%,
            #d8a83e 65%,
            #b78325 100%
        );
    border:
        3px solid #a87924;
    color: #8b651e;
    font-size: 20px;
    font-weight: 800;
    display: flex;
    justify-content: center;
    align-items: center;
    transform:
        rotate(-10deg);
    z-index: 4;
}
/* =========================
   SPIT BALL
========================= */
/*
   Đây là viên số bay ra từ miệng.
*/
.spit-ball {
    position: absolute;
    left: 50%;
    top: 111px;
    width: 32px;
    height: 32px;
    margin-left: -16px;
    border-radius: 50%;
    background: #3f7d58;
    border:
        2px solid #28563a;
    color: white;
    font-size: 13px;
    font-weight: 800;
    display: flex;
    justify-content: center;
    align-items: center;
    opacity: 0;
    pointer-events: none;
    z-index: 10;
}
/*
   Viên số bay từ miệng
   xuống khu vực kết quả.
*/
.spit-ball.fly {
    animation:
        spitNumber
        0.55s
        cubic-bezier(.2,.75,.25,1)
        forwards;
}
@keyframes spitNumber {
    0% {
        opacity: 0;
        transform:
            translate(
                0px,
                0px
            )
            scale(.45);
    }
    15% {
        opacity: 1;
        transform:
            translate(
                0px,
                -5px
            )
            scale(.75);
    }
    65% {
        opacity: 1;
        transform:
            translate(
                0px,
                62px
            )
            scale(1.05);
    }
    85% {
        opacity: 1;
        transform:
            translate(
                0px,
                78px
            )
            scale(.95);
    }
    100% {
        opacity: 0;
        transform:
            translate(
                0px,
                88px
            )
            scale(.75);
    }
}
/* =========================
   RESULT
========================= */
.result {
    margin-top: 2px;
}
.label {
    margin-bottom: 10px;
    font-size: 13px;
    color: #7b927d;
    font-weight: 600;
}
.numbers {
    display: flex;
    justify-content: center;
    gap: 8px;
    min-height: 48px;
}
.number-ball,
.special {
    width: 43px;
    height: 43px;
    border-radius: 50%;
    display: flex;
    justify-content: center;
    align-items: center;
    font-weight: 800;
    font-size: 17px;
    opacity: 0;
    transform:
        scale(.7);
}
/* main numbers */
.number-ball {
    background:
        linear-gradient(
            145deg,
            #5f9a70,
            #3f7d58
        );
    color: white;
    box-shadow:
        0 4px 10px
        rgba(63,125,88,.20);
}
/* special */
.special {
    margin: 12px auto 0;
    background:
        linear-gradient(
            145deg,
            #efd27b,
            #d8a83e
        );
    color: #70521a;
    box-shadow:
        0 4px 10px
        rgba(216,168,62,.25);
}
/* result appearance */
.number-ball.show,
.special.show {
    animation:
        resultAppear
        .4s
        ease-out
        forwards;
}
@keyframes resultAppear {
    0% {
        opacity: 0;
        transform:
            scale(.55)
            translateY(8px);
    }
    55% {
        opacity: 1;
        transform:
            scale(1.08)
            translateY(-2px);
    }
    100% {
        opacity: 1;
        transform:
            scale(1)
            translateY(0);
    }
}
/* =========================
   BUTTON
========================= */
button {
    margin-top: 24px;
    padding:
        14px 34px;
    border: none;
    border-radius: 15px;
    background:
        linear-gradient(
            135deg,
            #4e8d64,
            #3f7d58
        );
    color: white;
    font-size: 17px;
    font-weight: 800;
    cursor: pointer;
    box-shadow:
        0 7px 18px
        rgba(63,125,88,.23);
    transition:
        transform .15s ease;
}
button:active {
    transform:
        scale(.96);
}
button:disabled {
    opacity: .5;
    cursor: default;
}
/* =========================
   STATUS
========================= */
#status {
    margin-top: 14px;
    min-height: 20px;
    font-size: 13px;
    color: #7b927d;
}
/* =========================
   INFO
========================= */
.info {
    margin-top: 18px;
    font-size: 12px;
    line-height: 1.5;
    color: #8a998a;
}
</style>
</head>
<body>
<div class="container">
    <h1>LOKA 5/35</h1>
    <div class="subtitle">
        Mèo may mắn chọn số 🐱🍀
    </div>
    <!-- =====================
         CAT
    ====================== -->
    <div class="cat-area">
        <div class="cat" id="cat">
            <div class="cat-ear left"></div>
            <div class="cat-ear right"></div>
            <div class="eye left"></div>
            <div class="eye right"></div>
            <div class="cheek left"></div>
            <div class="cheek right"></div>
            <div class="nose"></div>
            <div class="mouth"></div>
            <div class="paw"></div>
            <div class="coin">
                ¥
            </div>
        </div>
        <!--
           Viên số bay ra khỏi miệng.
           JavaScript chỉ thay số và bật class fly.
        -->
        <div
            class="spit-ball"
            id="spitBall">
        </div>
    </div>
    <!-- =====================
         RESULT
    ====================== -->
    <div class="result">
        <div class="label">
            BỘ SỐ THAM KHẢO
        </div>
        <div class="numbers">
            <div
                class="number-ball"
                id="n1">
            </div>
            <div
                class="number-ball"
                id="n2">
            </div>
            <div
                class="number-ball"
                id="n3">
            </div>
            <div
                class="number-ball"
                id="n4">
            </div>
            <div
                class="number-ball"
                id="n5">
            </div>
        </div>
        <div
            class="label"
            style="margin-top:18px;">
            SỐ ĐẶC BIỆT
        </div>
        <div
            class="special"
            id="special">
        </div>
    </div>
    <button id="button">
        QUAY SỐ
    </button>
    <div id="status">
        Đang tải dữ liệu...
    </div>
    <div class="info">
        Dữ liệu 50 kỳ và 100 kỳ gần nhất.
        Trọng số được kết hợp 50/50 rồi
        chọn ngẫu nhiên.
    </div>
</div>
<script>
/* =========================
   DATA
========================= */
let history = [];
/* =========================
   ELEMENTS
========================= */
const button =
    document.getElementById("button");
const status =
    document.getElementById("status");
const cat =
    document.getElementById("cat");
const spitBall =
    document.getElementById("spitBall");
const balls = [
    document.getElementById("n1"),
    document.getElementById("n2"),
    document.getElementById("n3"),
    document.getElementById("n4"),
    document.getElementById("n5")
];
const specialBall =
    document.getElementById("special");
/* =========================
   SECURE RANDOM
========================= */
function random() {
    const array =
        new Uint32Array(1);
    crypto.getRandomValues(array);
    return array[0] /
        4294967296;
}
/* =========================
   FREQUENCY
========================= */
function frequency(
    records,
    max,
    specialMode = false
) {
    const freq =
        Array(max + 1).fill(0);
    for (const record of records) {
        if (specialMode) {
            const value =
                Number(record.special);
            if (
                value >= 1 &&
                value <= max
            ) {
                freq[value]++;
            }
        } else {
            for (
                const value
                of record.numbers
            ) {
                const n =
                    Number(value);
                if (
                    n >= 1 &&
                    n <= max
                ) {
                    freq[n]++;
                }
            }
        }
    }
    return freq;
}
/* =========================
   WEIGHTS
========================= */
function makeWeights(
    records,
    max,
    specialMode = false
) {
    const freq =
        frequency(
            records,
            max,
            specialMode
        );
    const expected =
        specialMode
            ? records.length / max
            : (
                records.length * 5
            ) / max;
    const weights =
        Array(max + 1).fill(0);
    for (
        let i = 1;
        i <= max;
        i++
    ) {
        weights[i] =
            Math.max(
                freq[i] / expected,
                0.01
            );
    }
    return weights;
}
/* =========================
   WEIGHTED PICK
========================= */
function weightedPick(
    items,
    weights
) {
    let total = 0;
    for (const item of items) {
        total += weights[item];
    }
    let r =
        random() * total;
    for (const item of items) {
        r -= weights[item];
        if (r <= 0) {
            return item;
        }
    }
    return items[
        items.length - 1
    ];
}
/* =========================
   MAIN NUMBERS
========================= */
function generateMain() {
    const recent50 =
        history.slice(-50);
    const recent100 =
        history.slice(-100);
    const weight50 =
        makeWeights(
            recent50,
            35,
            false
        );
    const weight100 =
        makeWeights(
            recent100,
            35,
            false
        );
    const weights = {};
    for (
        let i = 1;
        i <= 35;
        i++
    ) {
        weights[i] =
            weight50[i] * 0.5 +
            weight100[i] * 0.5;
    }
    const available = [];
    for (
        let i = 1;
        i <= 35;
        i++
    ) {
        available.push(i);
    }
    const result = [];
    while (
        result.length < 5
    ) {
        const picked =
            weightedPick(
                available,
                weights
            );
        result.push(picked);
        const index =
            available.indexOf(
                picked
            );
        if (index !== -1) {
            available.splice(
                index,
                1
            );
        }
    }
    result.sort(
        (a, b) => a - b
    );
    return result;
}
/* =========================
   SPECIAL
========================= */
function generateSpecial() {
    const recent50 =
        history.slice(-50);
    const recent100 =
        history.slice(-100);
    const weight50 =
        makeWeights(
            recent50,
            12,
            true
        );
    const weight100 =
        makeWeights(
            recent100,
            12,
            true
        );
    const weights = {};
    for (
        let i = 1;
        i <= 12;
        i++
    ) {
        weights[i] =
            weight50[i] * 0.5 +
            weight100[i] * 0.5;
    }
    const available = [];
    for (
        let i = 1;
        i <= 12;
        i++
    ) {
        available.push(i);
    }
    return weightedPick(
        available,
        weights
    );
}
/* =========================
   WAIT
========================= */
function wait(ms) {
    return new Promise(
        resolve =>
            setTimeout(
                resolve,
                ms
            )
    );
}
/* =========================
   SPIT EFFECT
========================= */
async function spitNumber(
    number,
    target
) {
    /*
       Xóa animation cũ
    */
    spitBall.classList.remove(
        "fly"
    );
    /*
       Đặt số lên viên bóng bay
    */
    spitBall.textContent =
        String(number)
            .padStart(2, "0");
    /*
       Ép trình duyệt nhận
       trạng thái mới trước
       khi chạy animation.
    */
    void spitBall.offsetWidth;
    /*
       Mèo mở miệng
    */
    cat.classList.add(
        "spitting"
    );
    /*
       Viên số bay ra
    */
    spitBall.classList.add(
        "fly"
    );
    /*
       Chờ animation kết thúc
    */
    await wait(550);
    /*
       Đóng miệng mèo
    */
    cat.classList.remove(
        "spitting"
    );
    /*
       Hiện số thật ở kết quả
    */
    target.classList.remove(
        "show"
    );
    void target.offsetWidth;
    target.textContent =
        String(number)
            .padStart(2, "0");
    target.classList.add(
        "show"
    );
    /*
       Chuẩn bị viên bay
       cho lần tiếp theo
    */
    spitBall.classList.remove(
        "fly"
    );
}
/* =========================
   GENERATE
========================= */
async function generate() {
    if (!history.length) {
        status.textContent =
            "Chưa tải được dữ liệu.";
        return;
    }
    button.disabled = true;
    status.textContent =
        "Mèo đang chọn số... 🐱";
    /*
       Xóa kết quả cũ
    */
    for (const ball of balls) {
        ball.classList.remove(
            "show"
        );
        ball.textContent = "";
    }
    specialBall.classList.remove(
        "show"
    );
    specialBall.textContent = "";
    /*
       Tạo bộ số
    */
    const mainNumbers =
        generateMain();
    const specialNumber =
        generateSpecial();
    /*
       Mèo nhả từng số
    */
    for (
        let i = 0;
        i < mainNumbers.length;
        i++
    ) {
        await spitNumber(
            mainNumbers[i],
            balls[i]
        );
        await wait(180);
    }
    /*
       Nhả số đặc biệt
    */
    await wait(250);
    await spitNumber(
        specialNumber,
        specialBall
    );
    status.textContent =
        "Đã chọn xong bộ số tham khảo 🍀";
    button.disabled = false;
}
/* =========================
   LOAD HISTORY
========================= */
async function loadHistory() {
    try {
        const response =
            await fetch(
                "history.json?cache=" +
                Date.now()
            );
        if (!response.ok) {
            throw new Error(
                "Không tải được history.json"
            );
        }
        history =
            await response.json();
        if (
            !Array.isArray(history) ||
            !history.length
        ) {
            throw new Error(
                "history.json không có dữ liệu"
            );
        }
        status.textContent =
            "Đã tải " +
            history.length +
            " kỳ quay.";
    } catch (error) {
        console.error(error);
        status.textContent =
            "Lỗi tải dữ liệu history.json.";
        button.disabled = true;
    }
}
/* =========================
   BUTTON
========================= */
button.addEventListener(
    "click",
    generate
);
/* =========================
   START
========================= */
loadHistory();
</script>
</body>
</html>
