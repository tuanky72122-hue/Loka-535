<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>LOKA-535</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #111;
      color: white;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    }

    .container {
      width: 90%;
      max-width: 420px;
      text-align: center;
    }

    h1 {
      margin-bottom: 8px;
      font-size: 32px;
      letter-spacing: 2px;
    }

    .subtitle {
      color: #999;
      margin-bottom: 40px;
      font-size: 15px;
    }

    button {
      width: 100%;
      padding: 18px;
      border: none;
      border-radius: 14px;
      background: white;
      color: #111;
      font-size: 18px;
      font-weight: 700;
      cursor: pointer;
    }

    button:active {
      transform: scale(0.98);
    }

    .numbers {
      margin-top: 35px;
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .number {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: #222;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 19px;
      font-weight: 700;
    }

    .info {
      margin-top: 25px;
      color: #777;
      font-size: 12px;
      line-height: 1.6;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>LOKA-535</h1>

    <div class="subtitle">
      LOTTO 5/35
    </div>

    <button onclick="generatePrediction()">
      LẤY BỘ SỐ
    </button>

    <div id="numbers" class="numbers"></div>

    <div class="info">
      50 kỳ + 100 kỳ · Blend 50/50<br>
      Weighted Random
    </div>

  </div>

  <script>

    const SHORT_WINDOW = 50;
    const LONG_WINDOW = 100;

    const SHORT_WEIGHT = 0.50;
    const LONG_WEIGHT = 0.50;


    async function loadHistory() {

      const response = await fetch(
        "history.json?ts=" + Date.now()
      );

      if (!response.ok) {
        throw new Error("Không thể đọc history.json");
      }

      return await response.json();
    }


    function calculateFrequency(history, window) {

      const recent = history.slice(-window);

      const frequency = {};

      for (let number = 1; number <= 35; number++) {
        frequency[number] = 0;
      }

      for (const record of recent) {

        for (const number of record.numbers) {
          frequency[number]++;
        }

      }

      return frequency;
    }


    function buildWeights(frequency, window) {

      const expected = window * 5 / 35;

      const weights = {};

      for (let number = 1; number <= 35; number++) {

        weights[number] = Math.max(
          frequency[number] / expected,
          0.01
        );

      }

      return weights;
    }


    function blendWeights(shortWeights, longWeights) {

      const weights = {};

      for (let number = 1; number <= 35; number++) {

        weights[number] =
          SHORT_WEIGHT * shortWeights[number] +
          LONG_WEIGHT * longWeights[number];

      }

      return weights;
    }


    function secureRandom() {

      const array = new Uint32Array(1);

      crypto.getRandomValues(array);

      return array[0] / 4294967296;
    }


    function weightedSample(weights) {

      const available = {
        ...weights
      };

      const selected = [];


      while (selected.length < 5) {

        let totalWeight = 0;

        for (const number in available) {
          totalWeight += available[number];
        }


        const randomValue =
          secureRandom() * totalWeight;


        let cumulative = 0;


        for (const number in available) {

          cumulative += available[number];


          if (randomValue <= cumulative) {

            selected.push(
              Number(number)
            );

            delete available[number];

            break;
          }

        }

      }


      return selected.sort(
        (a, b) => a - b
      );
    }


    async function generatePrediction() {

      const button =
        document.querySelector("button");

      const numbers =
        document.getElementById("numbers");


      button.disabled = true;

      button.textContent = "ĐANG TÍNH...";

      numbers.innerHTML = "";


      try {

        const history =
          await loadHistory();


        if (history.length < LONG_WINDOW) {

          throw new Error(
            "Không đủ dữ liệu."
          );

        }


        const shortFrequency =
          calculateFrequency(
            history,
            SHORT_WINDOW
          );


        const longFrequency =
          calculateFrequency(
            history,
            LONG_WINDOW
          );


        const shortWeights =
          buildWeights(
            shortFrequency,
            SHORT_WINDOW
          );


        const longWeights =
          buildWeights(
            longFrequency,
            LONG_WINDOW
          );


        const finalWeights =
          blendWeights(
            shortWeights,
            longWeights
          );


        const prediction =
          weightedSample(
            finalWeights
          );


        for (const number of prediction) {

          const element =
            document.createElement("div");

          element.className = "number";

          element.textContent =
            String(number).padStart(2, "0");

          numbers.appendChild(element);

        }

      } catch (error) {

        numbers.textContent =
          "Lỗi: " + error.message;

      }


      button.disabled = false;

      button.textContent = "LẤY BỘ SỐ";
    }

  </script>

</body>
</html>
